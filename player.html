<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Stream - Player</title>
    <script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>
    <style>
        :root {
            --bg: #0b0e14; --card: #13171f; --accent: #ff3d71; --text: #e0e0e0;
            --muted: #888; --border: rgba(255,255,255,0.08);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 1rem; min-height: 100vh; }
        .container { max-width: 600px; margin: auto; }
        .back-btn { background: none; border: none; color: var(--accent); font-size: 1.2rem; cursor: pointer; margin-bottom: 1rem; padding: 0.3rem 0.6rem; border-radius: 8px; }
        .back-btn:hover { background: var(--border); }
        #status { background: #1e1e1e; border: 1px solid #333; border-radius: 8px; padding: 0.7rem; margin: 0.8rem 0; font-size: 0.85rem; color: #ccc; white-space: pre-wrap; max-height: 200px; overflow-y: auto; }
        .movie-player-container {
            position: relative;
            width: 100%;
            height: 0;
            padding-bottom: 56.25%;
            margin: 1rem 0;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
        }
        .movie-player-container video {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
        }
        .play-direct-btn { display: block; background: #28a745; color: #fff; padding: 0.8rem; text-align: center; border-radius: 12px; margin: 1rem 0; font-weight: bold; text-decoration: none; font-size: 1rem; border: none; width: 100%; cursor: pointer; }
        .unavailable-msg { background: #1e1e1e; border: 1px solid #333; border-radius: 12px; padding: 1.5rem; text-align: center; color: var(--muted); margin: 1rem 0; }
        .episode-selector { display: flex; gap: 0.5rem; margin: 1rem 0; align-items: center; flex-wrap: wrap; }
        .episode-selector select { padding: 0.5rem; background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 6px; flex: 1; min-width: 100px; }
        .stream-links a { display: inline-block; margin: 0.3rem 0.5rem 0.3rem 0; padding: 0.5rem 0.8rem; background: var(--accent); color: #fff; border-radius: 8px; text-decoration: none; font-size: 0.8rem; }
        .loading-text { color: var(--muted); text-align: center; padding: 1rem; }
        .quality-selector { display: flex; align-items: center; gap: 0.5rem; margin: 0.5rem 0; }
        .quality-selector select { padding: 0.4rem; background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 6px; }
        .error-msg { color: #ff6b6b; margin-top: 0.5rem; }
        h2 { margin-bottom: 0.5rem; }
        .meta { color: var(--muted); margin-bottom: 1rem; }
        .description { margin: 1rem 0; line-height: 1.5; }
        .captions-btn { margin-top: 1rem; background: var(--card); border: 1px solid var(--border); padding: 0.5rem 1rem; color: white; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>
<div class="container">
    <button id="backBtn" class="back-btn">← Back to search</button>
    <div id="status" style="display:none;">Status: ready</div>
    <div id="detailContent"></div>
</div>

<script>
(function() {
    const statusDiv = document.getElementById('status');
    const detailContentDiv = document.getElementById('detailContent');
    const backBtn = document.getElementById('backBtn');

    let currentSubjectId = null;
    let currentSlug = null;
    let currentDetailData = null;
    let dashPlayer = null;
    let tvVideoElement = null;
    let selectedQuality = '480p';
    let apiBase = '';

    function log(msg) {
        statusDiv.style.display = 'block';
        statusDiv.textContent += '\n' + msg;
        console.log(msg);
    }

    function getApiBase() {
        return apiBase;
    }

    async function fetchJSON(path) {
        const url = getApiBase() + path;
        log('Fetching: ' + url);
        const res = await fetch(url);
        if (!res.ok) {
            const text = await res.text();
            throw new Error(`HTTP ${res.status}: ${text.substring(0, 200)}`);
        }
        return res.json();
    }

    // Initialize from sessionStorage
    function initFromStorage() {
        currentSlug = sessionStorage.getItem('currentSlug');
        currentSubjectId = sessionStorage.getItem('currentSubjectId');
        apiBase = sessionStorage.getItem('apiBase') || '';
        
        if (!currentSlug || !currentSubjectId) {
            detailContentDiv.innerHTML = '<div class="unavailable-msg"><p>No movie selected</p><p>Please go back and select a movie or series.</p></div>';
            return false;
        }
        return true;
    }

    async function loadDetail() {
        detailContentDiv.innerHTML = '<div class="loading-text">Loading details...</div>';
        log('Loading detail: ' + currentSlug);
        try {
            const detail = await fetchJSON('/detail/' + currentSlug);
            const stream = await fetchJSON('/api/stream/' + currentSubjectId + '?detail_path=' + currentSlug);
            currentDetailData = detail.data || detail;
            log('Detected type: ' + stream.detected_type + ', has_resource: ' + stream.has_resource);
            renderDetailPage(currentDetailData, stream);
        } catch(e) {
            detailContentDiv.innerHTML = '<div style="color:#ff6b6b;">Error: ' + e.message + '</div>';
            log('Error: ' + e.message);
        }
    }

    function getProxyStreamUrl(se = 0, ep = 0, format = 'auto') {
        let url = `${getApiBase()}/stream-proxy/${currentSubjectId}?detail_path=${encodeURIComponent(currentSlug)}&quality=${selectedQuality}&se=${se}&ep=${ep}`;
        if (format !== 'auto') url += `&format=${format}`;
        return url;
    }

    function renderDetailPage(detail, stream) {
        // Clean up existing players
        if (dashPlayer) { dashPlayer.destroy(); dashPlayer = null; }
        if (tvVideoElement) {
            tvVideoElement.pause();
            tvVideoElement.removeAttribute('src');
            tvVideoElement.load();
            tvVideoElement = null;
        }

        const title = detail.subject?.title || detail.title || detail.name || 'Unknown';
        const year = (detail.subject?.releaseDate || detail.releaseDate || '').slice(0,4);
        const rating = detail.subject?.imdbRatingValue || detail.imdbRatingValue || '';
        const desc = detail.subject?.description || detail.description || '';

        let html = `<h2>${title} (${year})</h2>`;
        html += `<div class="meta">${rating ? '⭐ ' + rating : ''}</div>`;
        if(desc) html += `<p class="description">${desc}</p>`;

        html += `
        <div class="quality-selector">
            <span>Quality:</span>
            <select id="qualitySelect">
                <option value="360p" ${selectedQuality==='360p'?'selected':''}>360p</option>
                <option value="480p" ${selectedQuality==='480p'?'selected':''}>480p</option>
                <option value="720p" ${selectedQuality==='720p'?'selected':''}>720p</option>
                <option value="1080p" ${selectedQuality==='1080p'?'selected':''}>1080p</option>
            </select>
        </div>`;

        if (stream.detected_type === 'movie') {
            if (stream.has_resource && (stream.dash?.length || stream.sources?.length)) {
                html += `<div id="dashPlayerContainer" class="movie-player-container" style="display:none;">
                    <video id="dashVideoElement" controls></video>
                </div>`;
                html += `<button id="playDashBtn" class="play-direct-btn">▶ Play Movie (Ad‑Free)</button>`;
            } else {
                html += `<div class="unavailable-msg">
                    <p>🚫 Stream not available</p>
                    <p>This movie doesn't have an ad‑free stream right now.</p>
                </div>`;
            }
        }

        if (stream.detected_type === 'tv' && detail.resource?.seasons?.length) {
            const seasons = detail.resource.seasons;
            const currentSeason = seasons.find(s => s.se === stream.se) || seasons[0];

            html += '<div class="episode-selector">';
            html += '<select id="seasonSelect">';
            seasons.forEach(s => html += `<option value="${s.se}" ${s.se === currentSeason.se ? 'selected' : ''}>Season ${s.se}</option>`);
            html += '</select>';
            html += '<select id="episodeSelect">';
            for (let ep = 1; ep <= currentSeason.maxEp; ep++) html += `<option value="${ep}" ${ep === stream.ep ? 'selected' : ''}>Ep ${ep}</option>`;
            html += '</select>';
            html += '</div>';

            html += `<div id="tvPlayerContainer" class="movie-player-container" style="display:none;">
                <video id="tvVideoElement" controls></video>
            </div>`;
            html += `<div id="tvPlayerError" class="error-msg" style="display:none;"></div>`;
        }

        html += '<div id="streamContainer">' + buildStreamLinks(stream) + '</div>';
        html += `<button id="loadCaptionsBtn" class="captions-btn">Load Subtitles</button>`;
        html += '<div id="captionsList" style="margin-top:1rem;"></div>';

        detailContentDiv.innerHTML = html;

        // Attach event listeners
        document.getElementById('qualitySelect').addEventListener('change', (e) => {
            selectedQuality = e.target.value;
            if (stream.detected_type === 'movie' && dashPlayer) {
                const video = document.getElementById('dashVideoElement');
                if (video) dashPlayer.attachSource(getProxyStreamUrl());
            }
            if (stream.detected_type === 'tv') {
                const se = parseInt(document.getElementById('seasonSelect').value);
                const ep = parseInt(document.getElementById('episodeSelect').value);
                loadStreamForEpisode(se, ep);
            }
        });

        if (stream.detected_type === 'movie' && (stream.dash?.length || stream.sources?.length)) {
            const playBtn = document.getElementById('playDashBtn');
            const container = document.getElementById('dashPlayerContainer');
            const video = document.getElementById('dashVideoElement');
            playBtn.addEventListener('click', () => {
                if (!dashPlayer) {
                    dashPlayer = dashjs.MediaPlayer().create();
                    dashPlayer.initialize(video, getProxyStreamUrl(), true);
                } else {
                    video.play();
                }
                container.style.display = 'block';
                video.play().catch(() => log('Autoplay blocked – press play'));
            });
        }

        if (stream.detected_type === 'tv' && detail.resource?.seasons) {
            const seasonSelect = document.getElementById('seasonSelect');
            const episodeSelect = document.getElementById('episodeSelect');
            const seasons = detail.resource.seasons;

            seasonSelect.addEventListener('change', () => {
                const selSeason = parseInt(seasonSelect.value);
                const obj = seasons.find(s => s.se === selSeason);
                if (obj) {
                    episodeSelect.innerHTML = '';
                    for (let ep = 1; ep <= obj.maxEp; ep++) {
                        episodeSelect.innerHTML += `<option value="${ep}">Ep ${ep}</option>`;
                    }
                    loadStreamForEpisode(selSeason, 1);
                }
            });

            episodeSelect.addEventListener('change', () => {
                const se = parseInt(seasonSelect.value);
                const ep = parseInt(episodeSelect.value);
                loadStreamForEpisode(se, ep);
            });

            const initialSe = parseInt(seasonSelect.value);
            const initialEp = parseInt(episodeSelect.value);
            loadStreamForEpisode(initialSe, initialEp);
        }

        document.getElementById('loadCaptionsBtn').addEventListener('click', async () => {
            const capDiv = document.getElementById('captionsList');
            capDiv.innerHTML = 'Loading...';
            try {
                const data = await fetchJSON('/api/stream/' + currentSubjectId + '/captions?detail_path=' + currentSlug + '&se=' + stream.se + '&ep=' + stream.ep);
                capDiv.innerHTML = data.count > 0 ? data.captions.map(c => `<div style="margin:0.2rem 0;"><a href="${c.url}" target="_blank">${c.language||'Unknown'} (${c.format||'vtt'})</a></div>`).join('') : 'No captions found.';
            } catch(e) { capDiv.innerHTML = '<span style="color:#ff6b6b;">Failed: ' + e.message + '</span>'; }
        });
    }

    function buildStreamLinks(stream) {
        let html = '<div class="stream-links"><strong>Available sources:</strong><br>';
        if(stream.has_resource && stream.sources?.length) {
            stream.sources.forEach(s => {
                const sizeMB = (s.size/1e6).toFixed(0);
                html += `<span style="margin:0.3rem 0; display:inline-block; background:#28a745; padding:0.4rem 0.8rem; border-radius:6px; color:#fff; font-size:0.8rem;">${s.resolution} (${sizeMB}MB)</span> `;
            });
            stream.dash?.forEach(d => {
                html += `<span style="margin:0.3rem 0; display:inline-block; background:#3366ff; padding:0.4rem 0.8rem; border-radius:6px; color:#fff; font-size:0.8rem;">DASH ${d.resolutions} (${d.codecName})</span> `;
            });
        } else {
            html += '<span style="color:var(--muted);">No stream available.</span>';
        }
        html += '</div>';
        return html;
    }

    function resetPlayer() {
        if (dashPlayer) {
            try { dashPlayer.destroy(); } catch(e) {}
            dashPlayer = null;
        }
        const video = document.getElementById('tvVideoElement');
        if (video) {
            video.pause();
            video.removeAttribute('src');
            video.load();
            const newVideo = video.cloneNode(true);
            video.parentNode.replaceChild(newVideo, video);
            newVideo.id = 'tvVideoElement';
            tvVideoElement = newVideo;
        }
    }

    async function loadStreamForEpisode(se, ep) {
        log(`Loading stream for S${se} E${ep} at ${selectedQuality}`);
        const container = document.getElementById('tvPlayerContainer');
        const errorDiv = document.getElementById('tvPlayerError');
        let video = document.getElementById('tvVideoElement');

        if (!container || !video) {
            log('Player container not found');
            return;
        }

        resetPlayer();
        video = document.getElementById('tvVideoElement');
        container.style.display = 'none';
        if (errorDiv) errorDiv.style.display = 'none';

        try {
            const stream = await fetchJSON(`/api/stream/${currentSubjectId}?detail_path=${currentSlug}&se=${se}&ep=${ep}`);
            log(`Stream data: hasResource=${stream.has_resource}, MP4 count=${stream.sources?.length||0}, DASH count=${stream.dash?.length||0}`);
            if (stream.dash?.length > 0) {
                log(`First DASH url: ${stream.dash[0].url}`);
            }

            if (!stream.has_resource || (stream.sources.length === 0 && stream.dash.length === 0)) {
                log('No playable source for this episode.');
                return;
            }

            if (stream.dash && stream.dash.length > 0) {
                const proxyUrl = getProxyStreamUrl(se, ep, 'dash');
                log('Using DASH: ' + proxyUrl);
                dashPlayer = dashjs.MediaPlayer().create();
                dashPlayer.initialize(video, proxyUrl, true);
                dashPlayer.on(dashjs.MediaPlayer.events.ERROR, (e) => {
                    log('Dash.js error: ' + JSON.stringify(e.error));
                    if (errorDiv) {
                        errorDiv.style.display = 'block';
                        errorDiv.textContent = 'DASH playback error. Trying MP4 fallback...';
                    }
                    loadStreamWithMP4(se, ep, stream);
                });
                container.style.display = 'block';
                video.play().catch(() => log('Autoplay blocked – press play'));
                tvVideoElement = video;
            } else if (stream.sources && stream.sources.length > 0) {
                loadStreamWithMP4(se, ep, stream);
            }
        } catch(e) {
            log('Failed to load episode: ' + e.message);
            if (errorDiv) {
                errorDiv.style.display = 'block';
                errorDiv.textContent = 'Error: ' + e.message;
            }
        }
    }

    async function loadStreamWithMP4(se, ep, stream) {
        const container = document.getElementById('tvPlayerContainer');
        const errorDiv = document.getElementById('tvPlayerError');
        const video = document.getElementById('tvVideoElement');
        if (!video) return;

        const proxyUrl = getProxyStreamUrl(se, ep, 'mp4');
        log('Using MP4: ' + proxyUrl);
        video.src = proxyUrl;
        container.style.display = 'block';
        video.play().catch(() => {});
        tvVideoElement = video;

        video.onerror = () => {
            const err = video.error;
            const msgs = ['', 'ABORTED', 'NETWORK', 'DECODE', 'SRC_NOT_SUPPORTED'];
            const msg = msgs[err?.code] || 'Unknown';
            log(`MP4 error: ${msg}`);
            if (errorDiv) {
                errorDiv.style.display = 'block';
                errorDiv.textContent = `MP4 playback failed (${msg}). The stream may not be available.`;
            }
        };
    }

    // Back button
    backBtn.addEventListener('click', () => {
        sessionStorage.removeItem('currentSlug');
        sessionStorage.removeItem('currentSubjectId');
        window.location.href = 'index.html';
    });

    window.onerror = function(m,s,l,c,e) { log('Unhandled error: ' + m + ' at ' + s + ':' + l); };
    window.onunhandledrejection = function(e) { log('Unhandled rejection: ' + e.reason); };

    // Initialize
    if (initFromStorage()) {
        loadDetail();
    }
})();
</script>
</body>
</html>
